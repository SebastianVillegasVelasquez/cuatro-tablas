[project]
name = "cuatro-tablas"
version = "0.1.0"
description = "Configurador 3D de muebles a medida: dominio, precio y API"
authors = [
    { name = "Sebastian Villegas Velasquez", email = "villegasvelasquezs@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
